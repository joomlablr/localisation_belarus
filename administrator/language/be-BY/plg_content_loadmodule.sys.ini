PLG_CONTENT_LOADMODULE="Змесціва - Загрузка модуляў"
PLG_LOADMODULE_XML_DESCRIPTION="У змесціве гэты плагін загружае модуль па ID, сінтаксіс: {loadmoduleid 1} або модуль па пазіцыі, сінтаксіс: {loadposition user1} або модуль па імені, сінтаксіс: {loadmodule mod_login}. Пры жаданні можна задаць стыль модуля і для loadmodule пэўны модуль па назве, Сінтаксіс: {loadmodule mod_login,module title,style}."

