COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_STEP_0_DESCRIPTION="<h3>Поўныя нататкі да выпуску Joomla 6.1</h3><p><a title=\"Поўныя нататкі да выпуску\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Прагледзець поўныя нататкі да выпуску на joomla.org</a></p><hr><h3>Дапамога і інфармацыя</h3><p>Тут вы знойдзеце шмат карысных рэсурсаў, а таксама дадатковыя спасылкі на дакументацыю, падтрымку і інфармацыю пра тое, як далучыцца да супольнасці Joomla.</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_STEP_0_TITLE="Больш інфармацыі і дапамога"
