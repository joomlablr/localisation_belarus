COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Вітаем у Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Асноўныя абнаўленні</h2><div class=\"col-12 mb-3\"><h3>Удасканаленне рэдагавання змесціва</h3><ul><li><strong>Інтэграцыя медыяменеджара і кнопкі «Чытаць далей»</strong>: дадаваць выявы і медыяфайлы стала прасцей дзякуючы абноўленаму акну выбару, якое цяпер адкрывае медыяменеджар Joomla, а новая кнопка «Чытаць далей» дазваляе хутчэй устаўляць разрывы ў артыкулах.</li><li><strong>Асобныя класы выявы і элемента figure</strong>: уступныя выявы і выявы поўнага тэксту артыкулаў цяпер маюць незалежныя палі CSS-класаў для самой выявы і элемента figure, які яе атачае.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Шматузроўневае меню\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Шаблон сайта (Cassiopeia)</h3><ul><li><strong>Шматузроўневыя выпадаючыя меню</strong>: меню Cassiopeia цяпер падтрымліваюць больш за адзін узровень укладзенасці ў выпадаючых і згортвальных макетах.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Модулі і налады сайта</h3><ul class=\"mb-3\"><li><strong>Пераключальнікі спасылак у mod_login</strong>: новыя параметры дазваляюць адміністратарам хаваць спасылкі «Забыліся пароль?» і «Забыліся імя карыстальніка?» без перавызначэння шаблона. Па змаўчанні спасылкі паказваюцца, таму на існуючыя сайты змены не ўплываюць.</li><li><strong>Пазнака абнаўлення бяспекі для пашырэнняў</strong>: распрацоўшчыкі могуць пазначаць выпуск як абнаўленне бяспекі (ад адсутнай да крытычнай ступені небяспекі); такія абнаўленні вылучаюцца ў раздзеле Сістэма → Абнаўленне → Пашырэнні і на панэлі кіравання.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Пазнакі бяспекі ў пашырэннях\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Што новага ў Joomla 6.2!"