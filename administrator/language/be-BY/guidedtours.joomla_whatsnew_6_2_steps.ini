COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Поўныя заўвагі да выпуску Joomla 6.2</h3><p><a title=\"Поўныя заўвагі да выпуску\" href=\"https://www.joomla.org/announcements/release-news/joomla-6-2-is-here.html" target=\"_blank\" rel=\"noopener noreferrer\">Праглядзець поўныя заўвагі да выпуску на joomla.org</a></p><hr><h3>Даведка і інфармацыя</h3><p class=\"mb-3\">Тут вы знойдзеце шмат карысных матэрыялаў, а таксама спасылкі на дадатковыя рэсурсы, дакументацыю, падтрымку і звесткі пра тое, як далучыцца да супольнасці Joomla.</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"Новы паказальнік даведкі\" width=\"450\" height=\"275\"></p>"
