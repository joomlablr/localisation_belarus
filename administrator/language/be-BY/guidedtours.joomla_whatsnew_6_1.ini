COM_COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Вітаем у Joomla 6.1!</h1><p>Joomla 6.1 уводзіць важныя паляпшэнні, якія робяць стварэнне сайтаў прасцейшым, бяспечнейшым і больш гнуткім. Гэты агляд пакажа асноўныя цікавосткі ў сціслай форме.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Абарона ад спаму ВЯРТАЕЦЦА з CAPTCHA на аснове Proof‑of‑Work</h2><p>Яна больш не патрабуе стварэння ўліковага запісу альбо API, прыязная да прыватнасці і даступная — гэтая капча ціха вырашае матэматычныя задачы ў фонавым рэжыме, застаючыся нябачнай для наведвальнікаў.</p><p>Каб уключыць, перайдзіце ў <em>Пашырэнні</em> -&gt; <em>Плагіны</em>, знайдзіце <strong>captcha</strong>, уключыце і прызначце па змаўчанні ў Глабальнай канфігурацыі.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"Капча паказвае станы verifying і verified\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Графічнае прадстаўленне базавага workflow\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Кантэнт‑пайплайн з наглядам дзякуючы Візуальнаму рэдактару Workflow</h2><p>Кіруйце працэсам публікацыі кантэнту прасцей з дапамогай новай інтэрактыўнай дыяграмы працоўнага працэсу, якая дазваляе бачыць увесь працэс публікацыі.</p><p>Уключыце Працоўныя працэсы ў <em>Мэнэджары артыкулаў</em> -&gt; <em>Працоўныя працэсы</em> і знайдзіце кнопку з графам.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Тры новыя медыя‑палі: Аўдыя, Відэа і Дакументы</h2><p>Ствараючы карыстальніцкія палі, вы цяпер можаце дазволіць аўтарам кантэнту дадаваць любыя тыпы медыя, а не толькі выявы.</p><p>Медыя адлюстроўваюцца як HTML5 &lt;audio&gt;, &lt;video&gt; або спасылкі на дакументы (PDF, табліцы і інш.).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"Тры варыянты медыя‑палёў: аўдыя, відэа і дакумент\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Разумнейшыя модулі з версіяваннем і міжмоўнымі асацыяцыямі</h2><p>Joomla ўжо даўно мае гісторыю версій для артыкулаў. Цяпер гэтая магчымасць пашыраецца і на модулі.<br>Калі вы вядзеце шматмоўны сайт, вы можаце асацыяваць модулі паміж мовамі такім жа чынам, як асацыюеце артыкулы.</p><h2>Іншыя вартыя ўвагі паляпшэнні</h2><ul class=\"mb-3\"><li>Падтрымка тега <strong>&lt;abbr&gt;</strong> у TinyMCE — семантычна правільна і паляпшае даступнасць (шукайце новую кнопку Abbreviation у панэлі TinyMCE).</li><li>Паляпшэнні ў статусе перапісвання моўных радкоў і хуткім стварэнні адсутных перапісванняў (індыкатар статусу, прасцейшае рэдагаванне).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Што новага ў Joomla 6.1!"
